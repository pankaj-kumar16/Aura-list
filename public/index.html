<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auralist - Login</title>
  <meta name="description" content="Log in to Auralist to discover royalty-free music, create custom playlists, and stream tracks effortlessly.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-compact-disc"></i>
          <span>Auralist</span>
        </div>
        <p class="auth-subtitle">Stream royalty-free music without limits</p>
      </div>

      <div id="alertBox" class="alert-box alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span>Log In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up for free</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (API.getToken()) {
      window.location.href = '/app';
    }

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const loginBtn = document.getElementById('loginBtn');

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.token) {
          API.setToken(res.token);
          API.setUser(res.user);
          window.location.href = '/app';
        } else {
          showError(res.error || 'Login failed. Please try again.');
        }
      } catch (err) {
        showError(err.message || 'Network error occurred.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Log In</span>';
      }
    });
  </script>
</body>
</html>
